<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="DJ Suman animated promo: make every moment move"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080b12"/><stop offset=".55" stop-color="#111426"/><stop offset="1" stop-color="#090c15"/></linearGradient><radialGradient id="glow"><stop stop-color="#3979df" stop-opacity=".42"/><stop offset="1" stop-color="#3979df" stop-opacity="0"/></radialGradient><linearGradient id="headline"><stop stop-color="#a895ff"/><stop offset=".52" stop-color="#71a8ff"/><stop offset="1" stop-color="#ff6fae"/></linearGradient><linearGradient id="ring" x2="1" y2="1"><stop stop-color="#a895ff" stop-opacity=".55"/><stop offset=".55" stop-color="#6ea9ff" stop-opacity=".2"/><stop offset="1" stop-color="#ff6fae" stop-opacity=".5"/></linearGradient><linearGradient id="bar" y2="1"><stop stop-color="#9a8cff"/><stop offset=".52" stop-color="#3979df"/><stop offset="1" stop-color="#ff6fae"/></linearGradient></defs><rect width="1920" height="1080" fill="url(#bg)"/><ellipse cx="1500" cy="500" rx="680" ry="630" fill="url(#glow)"/><ellipse cx="350" cy="180" rx="500" ry="460" fill="#ff6fae" opacity=".08"/><g class="light" opacity=".13"><path d="M1200 0H1610L1830 1080H990Z" fill="#3979df"/><animate attributeName="opacity" values=".08;.23;.08" dur="4s" repeatCount="indefinite"/></g><g class="light" opacity=".11"><path d="M1610 0H1810L1920 940H1450Z" fill="#ff6fae"/><animate attributeName="opacity" values=".06;.2;.06" dur="5s" repeatCount="indefinite"/></g><g transform="translate(1500 555)"><g class="record" fill="none" stroke="url(#ring)"><circle r="370" stroke-width="3"/><circle r="334" stroke-width="1"/><circle r="298" stroke-width="2"/><circle r="262" stroke-width="1"/><circle r="226" stroke-width="2"/><circle r="190" stroke-width="1"/><circle r="154" stroke-width="2"/></g><circle r="125" fill="#171c31" stroke="#7584b9" stroke-opacity=".35" stroke-width="2"/><circle r="28" fill="#3979df"/><circle r="7" fill="#eaf1ff"/></g><g fill="url(#bar)" opacity=".8"><rect class="bar b1" x="170" y="915" width="11" height="45" rx="5"/><rect class="bar b2" x="207" y="915" width="11" height="45" rx="5"/><rect class="bar b3" x="244" y="915" width="11" height="45" rx="5"/><rect class="bar b4" x="281" y="915" width="11" height="45" rx="5"/><rect class="bar b5" x="318" y="915" width="11" height="45" rx="5"/><rect class="bar b6" x="355" y="915" width="11" height="45" rx="5"/><rect class="bar b7" x="392" y="915" width="11" height="45" rx="5"/><rect class="bar b8" x="429" y="915" width="11" height="45" rx="5"/><rect class="bar b9" x="466" y="915" width="11" height="45" rx="5"/><rect class="bar b10" x="503" y="915" width="11" height="45" rx="5"/><rect class="bar b11" x="540" y="915" width="11" height="45" rx="5"/><rect class="bar b12" x="577" y="915" width="11" height="45" rx="5"/><rect class="bar b13" x="614" y="915" width="11" height="45" rx="5"/><rect class="bar b14" x="651" y="915" width="11" height="45" rx="5"/><rect class="bar b15" x="688" y="915" width="11" height="45" rx="5"/><rect class="bar b16" x="725" y="915" width="11" height="45" rx="5"/><rect class="bar b17" x="762" y="915" width="11" height="45" rx="5"/><rect class="bar b18" x="799" y="915" width="11" height="45" rx="5"/><rect class="bar b19" x="836" y="915" width="11" height="45" rx="5"/><rect class="bar b20" x="873" y="915" width="11" height="45" rx="5"/></g><text x="150" y="254" fill="#e7ebfa" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="7">WEDDINGS  ·  CELEBRATIONS  ·  PRIVATE EVENTS</text><text x="145" y="404" fill="#fff" font-family="Arial,sans-serif" font-size="116" font-weight="800" letter-spacing="-2">DJ SUMAN</text><text x="150" y="486" fill="url(#headline)" font-family="Arial,sans-serif" font-size="48" font-weight="700">MAKE EVERY MOMENT MOVE</text><text x="154" y="540" fill="#d3d9e8" font-family="Arial,sans-serif" font-size="23">Big feelings. Full dance floors. Nights worth remembering.</text><g class="pill"><rect x="150" y="622" width="278" height="68" rx="34" fill="#3979df"/><text x="289" y="665" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="1">BOOK YOUR DATE  ↗</text></g><path d="M150 1000H1770" stroke="#fff" stroke-opacity=".27"/><text x="150" y="1042" fill="#aeb8c8" font-family="Arial,sans-serif" font-size="17" font-weight="600" letter-spacing="3">GOOD MUSIC. GREAT MEMORIES.</text><style>.record{transform-origin:1500px 555px;animation:turn 18s linear infinite}.bar{transform-box:fill-box;transform-origin:center bottom;animation:pulse 1.1s ease-in-out infinite alternate}.b1,.b7,.b13,.b19{animation-delay:-.1s}.b2,.b8,.b14,.b20{animation-delay:-.6s}.b3,.b9,.b15{animation-delay:-.9s}.b4,.b10,.b16{animation-delay:-.3s}.b5,.b11,.b17{animation-delay:-.75s}.b6,.b12,.b18{animation-delay:-.45s}.pill{transform-origin:289px 656px;animation:throb 1.8s ease-in-out infinite}@keyframes turn{to{transform:rotate(360deg)}}@keyframes pulse{from{transform:scaleY(.4)}to{transform:scaleY(2.7)}}@keyframes throb{50%{transform:scale(1.05)}}@media(prefers-reduced-motion:reduce){.record,.bar,.pill{animation:none!important}}</style></svg>

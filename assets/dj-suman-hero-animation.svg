<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="Animated DJ stage lights and turntable rings"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080b12"/><stop offset=".55" stop-color="#111426"/><stop offset="1" stop-color="#090c15"/></linearGradient><radialGradient id="glow"><stop stop-color="#798695" stop-opacity=".36"/><stop offset="1" stop-color="#798695" stop-opacity="0"/></radialGradient><linearGradient id="ring" x2="1" y2="1"><stop stop-color="#a9b1ba" stop-opacity=".5"/><stop offset=".55" stop-color="#c4c9ce" stop-opacity=".2"/><stop offset="1" stop-color="#e0e2e4" stop-opacity=".38"/></linearGradient><linearGradient id="bar" y2="1"><stop stop-color="#9a8cff"/><stop offset=".52" stop-color="#798695"/><stop offset="1" stop-color="#e0e2e4"/></linearGradient></defs><rect width="1920" height="1080" fill="url(#bg)"/><ellipse cx="1480" cy="480" rx="640" ry="600" fill="url(#glow)"/><ellipse cx="380" cy="200" rx="470" ry="440" fill="#e0e2e4" opacity=".07"/><g fill="none" stroke="#f2f3f4" stroke-opacity=".08"><path d="M0 130H1920M0 950H1920"/><path d="M180 0V1080M1740 0V1080"/></g><g class="light" opacity=".15"><path d="M1200 0L1640 0 1820 1080 980 1080Z" fill="#798695"/><animate attributeName="opacity" values=".08;.24;.08" dur="4s" repeatCount="indefinite"/></g><g class="light" opacity=".13"><path d="M1610 0L1800 0 1920 920 1460 920Z" fill="#e0e2e4"/><animate attributeName="opacity" values=".08;.22;.08" dur="5s" repeatCount="indefinite"/></g><g transform="translate(1450 530)"><g class="rotator" fill="none" stroke="url(#ring)"><circle r="350" stroke-width="3"/><circle r="318" stroke-width="1"/><circle r="286" stroke-width="2"/><circle r="254" stroke-width="1"/><circle r="222" stroke-width="2"/><circle r="190" stroke-width="1"/><circle r="158" stroke-width="2"/><path d="M0-350V-318M350 0H318M0 350V318M-350 0H-318" stroke-width="3"/></g><circle r="128" fill="#171c31" stroke="#9299a1" stroke-opacity=".35" stroke-width="2"/><circle r="29" fill="#798695"/><circle r="7" fill="#ffffff"/></g><g fill="url(#bar)" opacity=".75"><rect class="bar b1" x="155" y="900" width="10" height="45" rx="5"/><rect class="bar b2" x="190" y="900" width="10" height="45" rx="5"/><rect class="bar b3" x="225" y="900" width="10" height="45" rx="5"/><rect class="bar b4" x="260" y="900" width="10" height="45" rx="5"/><rect class="bar b5" x="295" y="900" width="10" height="45" rx="5"/><rect class="bar b6" x="330" y="900" width="10" height="45" rx="5"/><rect class="bar b7" x="365" y="900" width="10" height="45" rx="5"/><rect class="bar b8" x="400" y="900" width="10" height="45" rx="5"/><rect class="bar b9" x="435" y="900" width="10" height="45" rx="5"/><rect class="bar b10" x="470" y="900" width="10" height="45" rx="5"/><rect class="bar b11" x="505" y="900" width="10" height="45" rx="5"/><rect class="bar b12" x="540" y="900" width="10" height="45" rx="5"/><rect class="bar b13" x="575" y="900" width="10" height="45" rx="5"/><rect class="bar b14" x="610" y="900" width="10" height="45" rx="5"/><rect class="bar b15" x="645" y="900" width="10" height="45" rx="5"/><rect class="bar b16" x="680" y="900" width="10" height="45" rx="5"/><rect class="bar b17" x="715" y="900" width="10" height="45" rx="5"/><rect class="bar b18" x="750" y="900" width="10" height="45" rx="5"/><rect class="bar b19" x="785" y="900" width="10" height="45" rx="5"/><rect class="bar b20" x="820" y="900" width="10" height="45" rx="5"/></g><style>.rotator{transform-origin:1450px 530px;animation:turn 18s linear infinite}@keyframes turn{to{transform:rotate(360deg)}}.bar{transform-box:fill-box;transform-origin:center bottom;animation:pulse 1.2s ease-in-out infinite alternate}.b1,.b7,.b13,.b19{animation-delay:-.1s}.b2,.b8,.b14,.b20{animation-delay:-.6s}.b3,.b9,.b15{animation-delay:-.9s}.b4,.b10,.b16{animation-delay:-.3s}.b5,.b11,.b17{animation-delay:-.75s}.b6,.b12,.b18{animation-delay:-.45s}@keyframes pulse{from{transform:scaleY(.4)}to{transform:scaleY(2.6)}}@media(prefers-reduced-motion:reduce){.rotator,.bar{animation:none!important}}</style></svg>

